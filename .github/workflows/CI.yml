name: CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - dev

jobs:
  # client:
  #   runs-on: ubuntu-latest

  #   defaults:
  #     run:
  #       working-directory: client

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test